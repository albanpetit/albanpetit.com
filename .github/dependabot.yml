version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for all minor and patch updates; majors stay separate
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Majors that need a migration first: Tailwind CSS 4 (tailwind-merge 3 requires it), TypeScript 7
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
      - dependency-name: tailwind-merge
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Node.js types follow the runtime version in .nvmrc
      - dependency-name: "@types/node"
        versions: [">=23"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
